<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <meta
      name="description"
      content="Lumora - an art marketplace on the Stellar Network. Artists list artwork and take commissions, buyers pay in XLM and Stellar assets, and every order is protected by escrow."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumora - Art Marketplace on Stellar" />
    <meta
      property="og:description"
      content="An art marketplace with commissions, escrow and payouts, powered by the Stellar Network."
    />
    <meta name="twitter:card" content="summary" />
    <title>Lumora - Art Marketplace on Stellar</title>
    <script>
      // Apply the persisted theme (or the OS system preference on first visit)
      // before first paint so the app never flashes the wrong colors (no FOUC).
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('lumora-theme')
        } catch (err) {
          stored = null
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'dark' ? '#12100e' : '#faf8f5'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
